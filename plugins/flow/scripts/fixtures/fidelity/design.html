<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fidelity fixture — the design side</title>
<!--
  One half of the differ's smoke test: a stand-in artboard, opened once in a
  real browser so `fidelity.mjs extract` is proven against a real
  getComputedStyle rather than against a stub that agrees with it.

  Self-contained on purpose — inline CSS, no script, no network, no web font,
  system stacks only, every landmark sized in px — because a fixture whose
  values move with the machine that opened it cannot be committed as the
  suite's expected values. It names no project, no framework and no design
  tool: `hero`, `nav`, `grid` are what any page has.

  Its sibling `page.html` is the same page built wrong: it differs from this
  one in every row kind the differ can print.
-->
<style>
  * { box-sizing: border-box }
  body { margin: 0; background-color: rgb(255, 255, 255); font-family: system-ui, -apple-system, sans-serif; color: rgb(17, 17, 17) }
  .frame { width: 900px }
  #hero { padding: 48px 32px; font-size: 32px; font-weight: 700; line-height: 40px; letter-spacing: 0.5px; color: rgb(17, 24, 39); background-color: rgb(245, 245, 245); border-radius: 12px }
  #hero h1 { margin: 0; font-size: inherit; font-weight: inherit }
  #nav { display: flex; flex-direction: row; column-gap: 16px; padding: 12px 16px; font-size: 14px }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 24px; row-gap: 24px; height: 200px; padding: 16px }
  #grid > div { background-color: rgb(230, 230, 230) }
  #card { height: 120px; padding: 16px; border-radius: 8px; background-color: rgb(250, 250, 250) }
  #card p { margin: 0; line-height: 24px }
  #legacy, #aside, #footer, #banner, #promo { height: 64px; padding: 8px; font-size: 14px; line-height: 20px }
</style>
</head>
<body>
  <div class="frame">
    <header id="hero"><h1>Landmark heading</h1></header>
    <nav id="nav"><a href="#one">one</a><a href="#two">two</a><a href="#three">three</a></nav>
    <section id="grid"><div></div><div></div><div></div></section>
    <section id="card"><p>one</p><p>two</p><p>three</p></section>
    <section id="legacy">legacy strip</section>
    <aside id="aside">aside</aside>
    <footer id="footer">footer</footer>
    <section id="banner">banner</section>
    <section id="promo">promo band</section>
  </div>
</body>
</html>
