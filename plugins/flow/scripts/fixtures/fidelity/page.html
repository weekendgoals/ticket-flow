<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fidelity fixture — the page side</title>
<!--
  The other half of the smoke test: the same page as `design.html`, built
  wrong, and wrong in every row kind the differ can print —

    hero     a different selector (`.masthead`, not `#hero`), so the report
             proves `side` picks the right one; and eight property rows
    nav      identical, so a clean landmark is proven to print nothing
    grid     a different track list and column gap
    card     one child fewer
    aside    swapped with `footer`, so both read a different `order`
    legacy   declared removed by the map, and built anyway
    banner   drawn and not built, declared nowhere
    promo    drawn and not built, declared removed by the map
    extra    built and drawn nowhere

  Self-contained for the same reason as its sibling: inline CSS, no script, no
  network, no web font, system stacks only, every landmark sized in px.
-->
<style>
  * { box-sizing: border-box }
  body { margin: 0; background-color: rgb(255, 255, 255); font-family: system-ui, -apple-system, sans-serif; color: rgb(17, 17, 17) }
  .frame { width: 900px }
  .masthead { padding: 24px 32px; font-size: 24px; font-weight: 600; line-height: 40px; letter-spacing: normal; color: rgb(107, 114, 128); background-color: rgb(255, 255, 255); border-radius: 4px; font-family: ui-monospace, SFMono-Regular, monospace }
  .masthead h1 { margin: 0; font-size: inherit; font-weight: inherit }
  #nav { display: flex; flex-direction: row; column-gap: 16px; padding: 12px 16px; font-size: 14px }
  #grid { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 16px; row-gap: 24px; height: 200px; padding: 16px }
  #grid > div { background-color: rgb(230, 230, 230) }
  #card { height: 120px; padding: 16px; border-radius: 8px; background-color: rgb(250, 250, 250) }
  #card p { margin: 0; line-height: 24px }
  #legacy, #aside, #footer, #extra { height: 64px; padding: 8px; font-size: 14px; line-height: 20px }
</style>
</head>
<body>
  <div class="frame">
    <header class="masthead"><h1>Landmark heading</h1></header>
    <nav id="nav"><a href="#one">one</a><a href="#two">two</a><a href="#three">three</a></nav>
    <section id="grid"><div></div><div></div></section>
    <section id="card"><p>one</p><p>two</p></section>
    <section id="legacy">legacy strip</section>
    <footer id="footer">footer</footer>
    <aside id="aside">aside</aside>
    <section id="extra">extra</section>
  </div>
</body>
</html>
