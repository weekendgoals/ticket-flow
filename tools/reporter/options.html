<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Reporter options</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: auto;
      max-width: 520px;
      margin: 24px auto;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .help {
      display: block;
      margin-top: 3px;
      font-weight: 400;
    }
    .target {
      margin: 0 0 12px;
      padding: 10px 12px 2px;
      border: 1px solid #dfe3e9;
      border-radius: 4px;
    }
    .target legend {
      padding: 0 4px;
      font-weight: 600;
      font-size: 12px;
    }
    .target-actions {
      margin: 0 0 10px;
    }
    h2 {
      margin: 18px 0 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Flow Reporter</h1>
  <form id="options">
    <label>GitHub token
      <input type="password" id="token" autocomplete="off" spellcheck="false">
      <span class="help muted">One fine-grained token for every target's repository.</span>
    </label>
    <label>Issue label
      <input type="text" id="label" autocomplete="off" spellcheck="false">
    </label>

    <h2>Targets</h2>
    <p class="help muted">Where a finding goes. The popup lists them by name; you need at least one to file.</p>
    <div id="targets"></div>
    <p class="target-actions"><button type="button" id="add-target" class="secondary">Add target</button></p>

    <div class="actions">
      <button type="submit">Save</button>
      <button type="button" id="test" class="secondary">Test token</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
