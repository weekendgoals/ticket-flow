# Every suite and every syntax check CLAUDE.md names, so a local run and the
# pull-request gate cannot drift apart. `flow doctor` is not run here: it
# reads the repository through an authenticated `gh`, and this job has no
# GitHub login to give it.
name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: syntax checks
        run: |
          node --check plugins/flow/scripts/flow.mjs
          node --check plugins/flow/scripts/issue-body.mjs
          node --check plugins/flow/scripts/checks.mjs
          node --check plugins/flow/scripts/epic-state.mjs
          node --check plugins/flow/scripts/delivery.mjs
          node --check plugins/flow/scripts/ticket-steps.mjs
          node --check plugins/flow/scripts/review-bots.mjs
          node --check plugins/flow/scripts/tracker/github.mjs
          node --check plugins/flow/scripts/tracker/fake-gh.mjs
          node --check plugins/flow/scripts/fidelity.mjs
          node --check plugins/flow/scripts/meter.mjs
          node --check plugins/flow/scripts/worktree-setup.mjs
      - name: parse run-epic.mjs the way the workflow runtime does
        run: |
          node -e 'const s=require("fs").readFileSync("plugins/flow/workflows/run-epic.mjs","utf8").replace(/^export const meta/m,"const meta");new (Object.getPrototypeOf(async function(){}).constructor)("agent","parallel","pipeline","log","phase","args","budget",s)'
      - name: test suites
        run: |
          node --test plugins/flow/scripts/flow.test.mjs
          node --test plugins/flow/scripts/issue-body.test.mjs
          node --test plugins/flow/scripts/checks.test.mjs
          node --test plugins/flow/scripts/tracker/github.test.mjs
          node --test plugins/flow/scripts/lifecycle.test.mjs
          node --test plugins/flow/scripts/pull-request.test.mjs
          node --test plugins/flow/scripts/fidelity.test.mjs
          node --test plugins/flow/scripts/meter.test.mjs
          node --test plugins/flow/scripts/worktree-setup.test.mjs
          node --test plugins/flow/workflows/run-epic.test.mjs
